<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Dara | Secure Clinical Vault</title>
    <style>
        :root {
            --bg-color: #f0f7f7;
            --card-bg: #ffffff;
            --primary: #0d9488;
            --primary-hover: #0f766e;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .portal-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(13, 148, 136, 0.1);
            border-top: 6px solid var(--primary);
            text-align: center;
        }
        .med-icon {
            width: 56px;
            height: 56px;
            background: #ccfbf1;
            color: var(--primary);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        h1 { font-size: 1.4rem; margin: 0 0 4px; color: var(--text-main); }
        p.subtitle { font-size: 0.875rem; color: var(--text-muted); margin: 0 0 24px; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="password"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: #f8fafc;
        }
        input[type="password"]:focus { outline: 2px solid var(--primary); border-color: transparent; }
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { margin-top: 16px; font-size: 0.875rem; font-weight: 500; min-height: 20px; }
        .success { color: #059669; }
        .error { color: #dc2626; }
    </style>
</head>
<body>

<div class="portal-card">
    <div class="med-icon">+</div>
    <h1>Dr. Dara | Secure Vault</h1>
    <p class="subtitle">Direct External Drive Transfer Portal</p>

    <div class="form-group">
        <label for="passcode">Access Passcode</label>
        <input type="password" id="passcode" placeholder="Enter your security code" required>
    </div>

    <div class="form-group">
        <label for="ghToken">GitHub Personal Access Token</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx (Saved locally on phone)" required>
    </div>

    <div class="form-group">
        <label for="fileInput">Select File to Transmit</label>
        <input type="file" id="fileInput" required>
    </div>

    <button id="uploadBtn" onclick="uploadFile()">Transmit to Hard Drive</button>
    <div id="status"></div>
</div>

<script>
    // --- CONFIGURATION ---
    const GITHUB_USERNAME = "YOUR_GITHUB_USERNAME";
    const REPO_NAME = "YOUR_REPO_NAME";
    const REQUIRED_PASSCODE = "YOUR_SECRET_ACCESS_CODE"; // e.g., "2026"
    // ---------------------

    // Auto-fill GitHub token if saved in phone browser previously
    window.onload = () => {
        const savedToken = localStorage.getItem("vault_gh_token");
        if (savedToken) document.getElementById("ghToken").value = savedToken;
    };

    async function uploadFile() {
        const passcode = document.getElementById("passcode").value;
        const token = document.getElementById("ghToken").value.trim();
        const fileInput = document.getElementById("fileInput");
        const status = document.getElementById("status");
        const btn = document.getElementById("uploadBtn");

        if (passcode !== REQUIRED_PASSCODE) {
            status.className = "error";
            status.innerText = "Access Denied: Invalid Passcode.";
            return;
        }
        if (!token || fileInput.files.length === 0) {
            status.className = "error";
            status.innerText = "Please enter your token and select a file.";
            return;
        }

        // Remember token on your phone so you only type the short passcode next time
        localStorage.setItem("vault_gh_token", token);

        const file = fileInput.files[0];
        btn.disabled = true;
        status.className = "";
        status.innerText = "Encrypting & transmitting file...";

        const reader = new FileReader();
        reader.onload = async function() {
            const base64Content = reader.result.split(',')[1];
            const timestamp = Date.now();
            const safeFileName = `${timestamp}_${file.name.replace(/\s+/g, '_')}`;
            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/incoming/${safeFileName}`;

            try {
                const response = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Upload ${safeFileName}`,
                        content: base64Content
                    })
                });

                if (response.ok) {
                    status.className = "success";
                    status.innerText = "Transmitted! Ready for hard drive sync.";
                    fileInput.value = "";
                } else {
                    const err = await response.json();
                    status.className = "error";
                    status.innerText = `Upload failed: ${err.message}`;
                }
            } catch (error) {
                status.className = "error";
                status.innerText = "Network error during transmission.";
            } finally {
                btn.disabled = false;
            }
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
